[project]
name = "nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ikram-sabila", email = "ikramsabila@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.15.0",
]

[project.scripts]
nlp = "nlp_rl:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nlp_rl"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
